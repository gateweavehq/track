packages:
  - apps/*
  - packages/*

# Versions shared across workspace packages. Reference them with "catalog:".
catalog:
  "@cloudflare/vitest-plugin": 1.6.0
  "@testing-library/react": 16.3.3
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  fractional-indexing: 4.0.0
  happy-dom: 21.0.4
  typescript: 7.0.2
  vitest: 5.1.0
  wrangler: 4.158.0
  zod: 4.6.7

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - better-auth@1.7.16
  - lucide-react@1.62.0
  - "@better-auth/mcp@1.7.16"
  - "@better-auth/oauth-provider@1.7.16"
  - better-call@1.4.5

# undici below 7.30.1 has high advisories (GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26,
# GHSA-2m5v-pch6-74hx and others). It only comes in through miniflare, for local dev and tests.
overrides:
  undici@>=7.0.0 <7.30.1: 7.30.1
  # esbuild up to 0.24.2 lets any website read a running esbuild dev server
  # (GHSA-67mh-4wv8-2f99). drizzle-kit brings 0.18.20 through @esbuild-kit/core-utils, which only
  # calls transform and transformSync and never starts that server.
  esbuild@<0.25.0: 0.25.12
