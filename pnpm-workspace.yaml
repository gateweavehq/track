packages:
  - apps/*
  - packages/*

# Versions shared across workspace packages. Reference them with "catalog:".
catalog:
  "@cloudflare/vitest-plugin": 1.4.8
  "@testing-library/react": 16.3.3
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  fractional-indexing: 4.0.0
  happy-dom: 21.0.4
  typescript: 7.0.2
  vitest: 5.0.5
  wrangler: 4.153.0
  zod: 4.6.7

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.14"
  - "@better-auth/drizzle-adapter@1.7.14"
  - "@better-auth/kysely-adapter@1.7.14"
  - "@better-auth/memory-adapter@1.7.14"
  - "@better-auth/mongo-adapter@1.7.14"
  - "@better-auth/prisma-adapter@1.7.14"
  - "@better-auth/telemetry@1.7.14"
  - better-auth@1.7.14
  - lucide-react@1.62.0

# undici below 7.30.1 has high advisories (GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26,
# GHSA-2m5v-pch6-74hx and others). It only comes in through miniflare, for local dev and tests.
overrides:
  undici@>=7.0.0 <7.30.1: 7.30.1
