name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, format, migrations
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # A pull request that adds Durable Object migrations or changes PROTOCOL_VERSION must come
  # after what its base already has, so parallel branches renumber before they merge, not after.
  # It checks the branch's own commit, not the merge GitHub makes, and needs the base's history.
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Migrations and protocol version against the base
        run: node scripts/check-migrations.mjs --base "origin/${{ github.base_ref }}"

  # Browser tests against the production build. Separate from `check` because they are slower
  # and need Chromium.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @gateweave/track-web exec playwright install --with-deps chromium
      - name: Build and run the browser tests
        run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Performance budgets: a cached open of a 2,000-issue workspace and the time for an edit to
  # reach another browser. Its own job, so a slow run is easy to tell from a broken test, and so
  # nothing else shares the runner while it times things. The numbers go to the job summary.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @gateweave/track-web exec playwright install --with-deps chromium
      - name: Build and measure
        run: pnpm test:perf
